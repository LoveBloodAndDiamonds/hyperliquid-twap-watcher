[project]
name = "hyperliquid-twap-watcher"
version = "0.1.0"

description = "Async watcher for Hyperliquid TWAP orders: new TWAPs, slice fills and completions delivered to callbacks"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "LoveBloodAndDiamonds", email = "ayazshakirzyanov27@gmail.com" },
]
requires-python = ">=3.12"
keywords = ["hyperliquid", "twap", "websocket", "crypto", "asyncio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: BSD License",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.12.15",
    "loguru>=0.7.3",
    "websockets>=15.0.1",
]

[project.urls]
Github = "https://github.com/LoveBloodAndDiamonds/hyperliquid-twap-watcher"
Author = "https://t.me/LoveBloodAndDiamonds"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hl_twap_watcher"]

[tool.hatch.build.targets.sdist]
include = ["hl_twap_watcher", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "build>=1.3.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.11.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
